name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # The library is built and tested on Linux with GCC, on Linux with
  # Clang and on Windows with MSVC. The Windows job matters most: the
  # golden regression test compares the new codec against the legacy
  # implementation, and that legacy code is what the Windows path
  # compiles.
  # ------------------------------------------------------------------
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (GCC)
            os: ubuntu-22.04
            compiler: gcc

          - name: Ubuntu (Clang)
            os: ubuntu-22.04
            compiler: clang

          - name: Windows (MSVC 2022)
            os: windows-2022
            qt: '6.6.2'
            qt_arch: msvc2019_64
            vcpkg_triplet: x64-windows
            vcpkg_opencv: opencv4

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Linux: install the compiler and OpenCV from the distribution
      # ------------------------------------------------------------------
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            libopencv-dev

      - name: Select the compiler (Ubuntu)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Configure (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLOCKCODEC_BUILD_GUI=OFF \
            -DBUILD_TESTING=ON

      - name: Build (Ubuntu)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 2

      # ------------------------------------------------------------------
      # Windows: OpenCV comes from vcpkg, the generator is the Visual
      # Studio one, so the multi configuration build needs -C Release.
      # ------------------------------------------------------------------
      - name: Set up vcpkg
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          vcpkg\bootstrap-vcpkg.bat -disableMetrics
          vcpkg\vcpkg.exe install ${{ matrix.vcpkg_opencv }}:${{ matrix.vcpkg_triplet }}

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.qt_arch }}
          modules: none
          cache: true

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DBLOCKCODEC_BUILD_GUI=OFF `
            -DBUILD_TESTING=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 2

      # ------------------------------------------------------------------
      # The tests. The checker is stricter than ctest itself: it fails
      # when a suite ran without a single check, when a suite reported a
      # failing check of its own, or when a suite is missing. The exit
      # code of ctest alone would not notice a suite that quietly
      # skipped its work.
      # ------------------------------------------------------------------
      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: python3 tools/check_ctest.py --build-dir build --expected-suites 11

      # The golden regression test compares against the legacy
      # implementation, which is the Windows path that compiles it, so
      # this job is the one that has to pass.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python tools/check_ctest.py --build-dir build --config Release --expected-suites 11

      - name: Check that the reference vectors are reproducible
        if: runner.os == 'Windows'
        run: |
          .\build\Release\blockcodec_vector_gen.exe tests\vectors
          git diff --exit-code -- tests/vectors

  # ------------------------------------------------------------------
  # AddressSanitizer and UndefinedBehaviorSanitizer. This is the job
  # that guards the classes of defect the codec is careful about: a
  # buffer that overflowed, a read of uninitialised memory, and a
  # shift past the width of an integer.
  #
  # The OpenCV libraries are found at run time through libopencv-dev,
  # which puts them on the loader path. A loader error shows up as a
  # failed test, not as an assertion failure.
  # ------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan, UBSan)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libopencv-dev

      # -fno-sanitize-recover turns an undefined operation into a fatal
      # error. Without it UndefinedBehaviorSanitizer only prints a
      # diagnostic and lets the program continue, so a program with an
      # undefined shift in it would still pass.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBLOCKCODEC_BUILD_GUI=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: python3 tools/check_ctest.py --build-dir build --expected-suites 11

  # ------------------------------------------------------------------
  # The Qt GUI is an example application. It is built here so that a
  # breakage in it is visible, but it must not fail the pipeline: the
  # library itself is the deliverable and the GUI is not.
  # ------------------------------------------------------------------
  gui:
    name: Qt GUI
    runs-on: ubuntu-22.04

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # The OpenGL development headers are needed because the Qt Gui
      # component depends on WrapOpenGL, and WrapOpenGL looks for the
      # headers in OPENGL_INCLUDE_DIR. Without them the Qt package reports
      # that the Gui component is missing, and the configure step fails.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libopencv-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            libgl-dev \
            libglu1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLOCKCODEC_BUILD_GUI=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: python3 tools/check_ctest.py --build-dir build --expected-suites 11
