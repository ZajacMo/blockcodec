name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC 2022, Qt 6, OpenCV 4)
            os: windows-2022
            qt: '6.6.2'
            qt_arch: msvc2019_64
            vcpkg_triplet: x64-windows
            vcpkg_opencv: opencv4

          - name: Ubuntu (GCC, Qt 6, OpenCV 4)
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Linux: install Qt and OpenCV from the distribution packages
      # ------------------------------------------------------------------
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            libopencv-dev

      - name: Configure (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI_APP=ON \
            -DBUILD_TESTING=ON

      - name: Build (Ubuntu)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 2

      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # ------------------------------------------------------------------
      # Windows: install Qt via aqtinstall and OpenCV via vcpkg
      # ------------------------------------------------------------------
      - name: Set up vcpkg
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          vcpkg\bootstrap-vcpkg.bat -disableMetrics
          vcpkg\vcpkg.exe install ${{ matrix.vcpkg_opencv }}:${{ matrix.vcpkg_triplet }}

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.qt_arch }}
          modules: none
          cache: true

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DBUILD_GUI_APP=ON `
            -DBUILD_TESTING=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 2

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
